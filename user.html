<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#002247">
  <title>EIGHT CREATORS LABs — Mi Portal</title>
  <meta name="description" content="Portal de desempeño del equipo creativo EIGHT CREATORS — CELIDER 08 Santiago.">
  <meta property="og:title" content="EIGHT CREATORS LABs — Mi Portal">
  <meta property="og:description" content="Sistema de evaluación de desempeño para el equipo creativo de CELIDER 08 Santiago.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/x-icon" href="icono.ico">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <script src="core/theme.js"></script>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="user.css">
</head>
<body>

<div id="top"></div>
<div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
<a href="#top" class="back-top" id="back-top" aria-label="Volver arriba"></a>

<!-- Navegación: rail (escritorio) y barra inferior (móvil).
     El marcado lo genera initNav() de core/rail.js desde datos. -->
<aside class="rail" id="rail"></aside>
<nav class="bottom-bar" id="bottom-bar"></nav>
<a href="#contenido" class="skip-link">Saltar al contenido</a>
<!-- TAB: MI SCORE -->
<main id="contenido">
<div id="tab-scores" class="tab-content active">
  <div class="m-hero">
    <div class="m-hero-inner">
      <div class="hero-left">
        <div class="m-tag">CREATORS SCORE SYSTEM · CELIDER 08</div>
        <div class="m-name-big" id="hero-name">—</div>
        <div class="m-pe-label">Período activo: <span id="hero-pe">PE1</span></div>
      </div>
      <div class="hero-right">
        <div class="score-big" id="hero-score">—</div>
        <div class="score-lbl">/ <span id="hero-max">28</span> PTS · <span id="hero-nivel">—</span></div>
      </div>
    </div>
  </div>
  <div class="m-content">
    <!-- Los botones los genera renderPEBar() desde periodos_evaluacion -->
    <div class="pe-row" id="pe-row-scores" role="group" aria-label="Seleccionar período de evaluación">
    </div>
    <div id="score-body"><div class="loading-box"><span class="spin"></span></div></div>
    <!-- La rubrica deja de ser pestana: es referencia de "como se califica
         esto" y se consulta justo donde surge la duda, bajo las barras. -->
    <details class="rubrica-details" id="rubrica-details">
      <summary class="rubrica-summary">¿Cómo se califica esto?</summary>
      <div class="rubrica-wrap">
        <p class="rubrica-intro">Cada criterio se evalúa del <strong>1 al 4</strong>. Puntaje máximo: <strong>28 puntos</strong>.</p>
        <div class="rubrica-grid" id="rubrica-grid"></div>
      </div>
    </details>
    <div class="ql-section-label">Accesos rápidos</div>
    <div class="ql-grid" id="quick-links"></div>
  </div>
</div>

<!-- TAB: TRABAJOS ENTREGADOS -->
<div id="tab-trabajos" class="tab-content">
  <div class="m-content tab-top-pad">
    <h2 class="tab-title tab-title--mb">ENTREGAS</h2>
    <div class="pe-row" id="trabajos-pe-row" role="group" aria-label="Seleccionar período de evaluación">
    </div>
    <section class="hist-sec">
      <h3 class="hist-sub">Mis trabajos</h3>
      <div id="trabajos-body"><div class="loading-box"><span class="spin"></span></div></div>
    </section>
    <section class="hist-sec">
      <h3 class="hist-sub">Fechas del período</h3>
      <div id="periodos-body" class="pe-cards-grid"></div>
    </section>
    <section class="hist-sec">
      <h3 class="hist-sub">Calendario</h3>
      <div class="cal-grid" id="cal-grid">
        <div class="loading-box" style="grid-column:1/-1"><span class="spin"></span></div>
      </div>
    </section>
  </div>
</div>

<!-- HISTORIAL: solo la evolución entre períodos. Las fechas y el
     calendario viven en Entregas, que es donde se pregunta "qué debo
     entregar y cuándo". -->
<div id="tab-historial" class="tab-content">
  <div class="m-content tab-top-pad">
    <h2 class="tab-title tab-title--mb">HISTORIAL</h2>
    <div id="rpt-user-body"><div class="loading-box"><span class="spin"></span></div></div>
  </div>
</div>

</main>

<div class="toast" id="toast" role="alert" aria-live="polite"></div>
<input type="file" id="avatar-file-input" aria-label="Seleccionar foto de perfil" accept="image/*" style="display:none" data-change="handleAvatarUpload">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="core/store.js"></script>
<script src="core/render.js"></script>
<script src="core/rail.js"></script>
<script src="core/charts.js"></script>
<script src="supabase-client.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="user.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.474.0/dist/umd/lucide.min.js" integrity="sha384-wkxmY9HYHJVzx0oZ7k8stpLQ7g7ogSqBha75ozCZmxFadwtaIw5dzXKVWWfi9I36" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
