<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#002247">
  <title>EIGHT CREATORS LABs — Mi Portal</title>
  <meta name="description" content="Portal de desempeño del equipo creativo EIGHT CREATORS — CELIDER 08 Santiago.">
  <meta property="og:title" content="EIGHT CREATORS LABs — Mi Portal">
  <meta property="og:description" content="Sistema de evaluación de desempeño para el equipo creativo de CELIDER 08 Santiago.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/x-icon" href="icono.ico">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="user.css">
</head>
<body>

<div id="top"></div>
<div class="bg-canvas" aria-hidden="true">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
</div>
<div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
<a href="#top" class="back-top" id="back-top" aria-label="Volver arriba"></a>

<!-- TOPBAR -->
<header class="topbar" id="topbar">
  <button class="tb-brand tb-brand--link" data-act="tabPrimero" data-arg="scores" aria-label="Ir a Mi Score">
    <picture><source srcset="logo.webp 1x, logo@2x.webp 2x" type="image/webp"><img src="logo.png" alt="" class="tb-logo" width="44" height="44" onerror="this.style.display='none'"></picture>
    <span class="tb-title">EIGHT<em> CREATORS</em></span>
  </button>
  <nav class="tb-nav" id="desktop-nav">
    <button class="tnav active" data-act="tab" data-arg="scores"><i data-lucide="bar-chart-2" class="nav-icon"></i> Mi Score</button>
    <button class="tnav" data-act="tab" data-arg="trabajos"><i data-lucide="folder-open" class="nav-icon"></i> Entregas</button>
    <button class="tnav" data-act="tab" data-arg="historial"><i data-lucide="history" class="nav-icon"></i> Historial</button>
  </nav>
  <div class="tb-user">
    <span id="gestion-switch" hidden></span>
    <span class="last-updated-badge" id="ts-badge"></span>
    <div class="avatar" id="av-desktop">?</div>
    <span class="uname" id="uname-desktop">—</span>
    <button class="btn-out" data-act="salir">Salir</button>
    <button class="theme-toggle" id="theme-toggle" data-act="fn" data-arg="toggleTheme" aria-label="Cambiar tema"><i data-lucide="sun" class="icon-sun"></i><i data-lucide="moon" class="icon-moon"></i><span class="theme-icon" hidden></span></button>
  </div>
  <button class="hamburger" id="hamburger" aria-label="Menú" aria-expanded="false" data-act="fn" data-arg="toggleMenu">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobile-menu">
  <div class="mobile-nav-links">
    <button class="mobile-nav-btn active" data-act="tabMovil" data-arg="scores"><i data-lucide="bar-chart-2" class="nav-icon"></i>Mi Score</button>
    <button class="mobile-nav-btn" data-act="tabMovil" data-arg="trabajos"><i data-lucide="folder-open" class="nav-icon"></i>Entregas</button>
    <button class="mobile-nav-btn" data-act="tabMovil" data-arg="historial"><i data-lucide="history" class="nav-icon"></i>Historial</button>
    <div class="mobile-theme-row">
      <span class="mobile-theme-lbl">Tema</span>
      <button class="theme-toggle" data-act="fn" data-arg="toggleTheme" aria-label="Cambiar tema"><i data-lucide="sun" class="icon-sun"></i><i data-lucide="moon" class="icon-moon"></i><span class="theme-icon" hidden></span></button>
    </div>
  </div>
  <div class="mobile-user-section">
    <div class="avatar" id="av-mobile">?</div>
    <div class="mobile-uinfo">
      <div class="mobile-uname" id="uname-mobile">—</div>
      <div class="mobile-urole">Miembro del equipo</div>
      <div class="last-updated-badge" id="ts-badge-mob"></div>
    </div>
    <button class="btn-out-mobile" data-act="salir">Salir</button>
  </div>
</div>

<!-- TAB: MI SCORE -->
<div id="tab-scores" class="tab-content active">
  <div class="m-hero">
    <div class="m-hero-inner">
      <div class="hero-left">
        <div class="m-tag">CREATORS SCORE SYSTEM · CELIDER 08</div>
        <div class="m-name-big" id="hero-name">—</div>
        <div class="m-pe-label">Período activo: <span id="hero-pe">PE1</span></div>
      </div>
      <div class="hero-right">
        <div class="score-big" id="hero-score">—</div>
        <div class="score-lbl">/ <span id="hero-max">28</span> PTS · <span id="hero-nivel">—</span></div>
      </div>
    </div>
  </div>
  <div class="m-content">
    <!-- Los botones los genera renderPEBar() desde periodos_evaluacion -->
    <div class="pe-row" id="pe-row-scores" role="group" aria-label="Seleccionar período de evaluación">
    </div>
    <div id="score-body"><div class="loading-box"><span class="spin"></span></div></div>
    <!-- La rubrica deja de ser pestana: es referencia de "como se califica
         esto" y se consulta justo donde surge la duda, bajo las barras. -->
    <details class="rubrica-details" id="rubrica-details">
      <summary class="rubrica-summary">¿Cómo se califica esto?</summary>
      <div class="rubrica-wrap">
        <p class="rubrica-intro">Cada criterio se evalúa del <strong>1 al 4</strong>. Puntaje máximo: <strong>28 puntos</strong>.</p>
        <div class="rubrica-grid" id="rubrica-grid"></div>
      </div>
    </details>
    <div class="ql-section-label">Accesos rápidos</div>
    <div class="ql-grid" id="quick-links"></div>
  </div>
</div>

<!-- TAB: PERÍODOS -->


<!-- TAB: TRABAJOS ENTREGADOS -->
<div id="tab-trabajos" class="tab-content">
  <div class="m-content tab-top-pad">
    <h2 class="tab-title tab-title--mb">MIS TRABAJOS ENTREGADOS</h2>
    <div class="pe-row" id="trabajos-pe-row" role="group" aria-label="Seleccionar período de evaluación">
    </div>
    <div id="trabajos-body" style="margin-top:16px"><div class="loading-box"><span class="spin"></span></div></div>
  </div>
</div>

<!-- TAB: RÚBRICA -->


<!-- TAB: REPORTES -->


<!-- TAB: CALENDARIO -->



<!-- TAB: HISTORIAL — "Periodos" y "Calendario" eran el mismo dato (las
     fechas de cada PE) partido en dos, y "Reportes" es su vista temporal. -->
<div id="tab-historial" class="tab-content">
  <div class="m-content tab-top-pad">
    <h2 class="tab-title tab-title--mb">HISTORIAL</h2>
    <section class="hist-sec">
      <h3 class="hist-sub">Mi desempeño</h3>
      <div id="rpt-user-body"><div class="loading-box"><span class="spin"></span></div></div>
    </section>
    <section class="hist-sec">
      <h3 class="hist-sub">Períodos de evaluación</h3>
      <div id="periodos-body" class="pe-cards-grid"></div>
    </section>
    <section class="hist-sec">
      <h3 class="hist-sub">Calendario</h3>
      <div class="cal-grid" id="cal-grid">
        <div class="loading-box" style="grid-column:1/-1"><span class="spin"></span></div>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="alert" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js"></script>
<script src="core/store.js"></script>
<script src="core/render.js"></script>
<script src="supabase-client.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="user.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.474.0/dist/umd/lucide.min.js" integrity="sha384-wkxmY9HYHJVzx0oZ7k8stpLQ7g7ogSqBha75ozCZmxFadwtaIw5dzXKVWWfi9I36" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function(){
  var R=document.documentElement,K='ec-theme';
  function apply(t){
    R.dataset.theme=t;
  }
  window.toggleTheme=function(){var n=R.dataset.theme==='light'?'dark':'light';localStorage.setItem(K,n);apply(n);};
  var s=localStorage.getItem(K);
  if(s){apply(s);}else if(window.matchMedia('(prefers-color-scheme:light)').matches){apply('light');}
  if(typeof lucide!=='undefined')lucide.createIcons();
})();

window.addEventListener('scroll', function() {
  var p = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
  document.getElementById('scroll-progress').style.width = p + '%';
}, { passive: true });
</script>
</body>
</html>
